name: wsl-smoke
on:
  push:
    paths: ['wsl-smoke.mjs', '.github/workflows/wsl-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Antumi's WSL modules, bundled from packages/desktop/src/main/wsl/wsl-smoke.ts.
      - name: Smoke
        shell: powershell
        run: node wsl-smoke.mjs Ubuntu-24.04 --mutate
