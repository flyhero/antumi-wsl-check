name: wsl-smoke
on:
  push:
    paths: ['wsl-smoke.mjs', 'wsl-tunnel.mjs', '.github/workflows/wsl-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
      # What Antumi asks of a distro: a Node new enough for core (22.13). Fetched on Windows and
      # sent in over stdin, so the distro needs neither apt nor a network of its own.
      - name: Node in the distro
        shell: cmd
        run: |
          curl.exe -fsSL -o node.tar.gz https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz
          wsl.exe -d Ubuntu-24.04 --exec tar -xz -C /usr/local --strip-components=1 < node.tar.gz
          wsl.exe -d Ubuntu-24.04 --exec /usr/local/bin/node --version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Antumi's WSL modules, bundled from packages/desktop/src/main/wsl/wsl-smoke.ts.
      - name: Smoke
        shell: powershell
        run: node wsl-smoke.mjs Ubuntu-24.04 --mutate --tunnel wsl-tunnel.mjs
      # The backend's launch outliving the process that made it, as the app's must when it quits.
      - name: Launch and leave
        if: always()
        shell: powershell
        run: node wsl-smoke.mjs Ubuntu-24.04 --launch
      - name: Wait three minutes with nothing touching WSL
        if: always()
        shell: powershell
        run: Start-Sleep -Seconds 185
      - name: Check the launch
        if: always()
        shell: powershell
        run: node wsl-smoke.mjs Ubuntu-24.04 --check-launch
